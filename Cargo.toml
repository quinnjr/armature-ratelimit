[package]
name = "armature-ratelimit"
version = "0.4.0"
edition = "2024"
rust-version = "1.94.1"
autobenches = false  # Disable auto-discovery, use explicit [[bench]] only
authors = ["Joseph Quinn <quinn.josephr@proton.me>"]
license = "Apache-2.0"
repository = "https://github.com/quinnjr/armature-ratelimit"
homepage = "https://quinnjr.github.io/armature"
description = "Rate limiting middleware for Armature framework with multiple algorithms and storage backends"
keywords = ["rate-limiting", "middleware", "throttle", "api", "web"]
categories = ["web-programming", "network-programming"]

[dependencies]
# Armature core for Middleware trait
armature-core = { version = "0.9" }
armature-log = { version = "0.2" }

# Core dependencies
async-trait = "0.1"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.52", features = ["rt", "rt-multi-thread", "macros", "sync", "time"] }
futures = "0.3"
tracing = "0.1"

# In-memory store
dashmap = "6.2"

# HTTP types (for middleware)
http = "1.4"
bytes = "1.12"

# Redis support (optional) - uses armature-redis for DI integration
armature-redis = { version = "0.2", optional = true }
redis = { version = "1.3", features = ["tokio-comp", "connection-manager"], optional = true }

[features]
default = []
redis = ["dep:redis", "armature-redis"]
full = ["redis"]

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports", "async_tokio"] }
cargo-husky = { version = "1.5", default-features = false, features = ["user-hooks"] }
tokio = { version = "1.52", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "fs", "test-util"] }
tokio-test = "0.4"
# Docker-backed Redis for the Redis-store regression tests. Self-skips when
# Docker is unavailable (see `skip_if_no_docker!`), so the default `cargo test`
# never requires a container.
armature-testkit = { path = "../armature-testkit", features = ["containers"] }

# Explicit bench targets only: a stray file under benches/ should not silently
# become a target.
[[bench]]
name = "ratelimit"
harness = false
